<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人主頁</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 頂部導覽列 */
        header {
            background-color: #24292e;
            color: white;
            padding: 20px;
            width: 100%;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        /* 按鈕容器 */
        .container {
            width: 90%;
            max-width: 600px; /* 電腦版不會太寬 */
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px; /* 按鈕之間的間距 */
        }
        /* 手機好按的大按鈕樣式 */
        .btn {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-size: 1.2em;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.98); /* 點擊時有縮小效果 */
            background-color: #e6e6e6;
        }
    </style>
</head>
<body>

    <header>
        我的個人導航
    </header>

    <div class="container">
        <a href="https://www.google.com" class="btn">🔍 Google 搜尋</a>
        <a href="https://www.youtube.com" class="btn">📺 YouTube</a>
        <a href="https://chatgpt.com" class="btn">🤖 ChatGPT</a>
        <a href="https://github.com" class="btn">🐙 GitHub</a>
    </div>

</body>
</html>
